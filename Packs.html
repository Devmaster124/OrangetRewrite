<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Oranget Packs</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#12081c;color:#fff;min-height:100vh}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:#1a0f28f2;border-bottom:1px solid #ffffff14}
header h1{margin:0;font-size:22px}
.tabs{display:flex;gap:8px}
.tabs button{border:0;border-radius:999px;padding:8px 14px;background:#2a1a40;color:#fff;font-weight:800;cursor:pointer}
.tabs button.on{background:#f79a3e;color:#1a1020}
.tokens{display:flex;align-items:center;gap:8px;background:#2a1a40;border-radius:999px;padding:8px 12px;font-weight:800}
.tokens button{border:0;background:#f79a3e;color:#1a1020;border-radius:999px;padding:4px 10px;font-weight:900;cursor:pointer}
main{padding:16px;max-width:1100px;margin:0 auto}
.mute{opacity:.75;margin:0 0 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{border:0;border-radius:16px;padding:12px;text-align:left;cursor:pointer;background:linear-gradient(160deg,var(--c1),var(--c2));color:#fff;box-shadow:0 10px 24px #0005}
.card img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:12px;background:#0003;display:block}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:800}
.section{margin-bottom:22px}
.section h2{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.blook{position:relative;background:#221533;border-radius:14px;padding:10px;text-align:center;border:2px solid #ffffff12}
.blook img{width:72px;height:72px;object-fit:contain;display:block;margin:0 auto 6px}
.blook .name{font-size:12px;font-weight:700}
.blook .rar{font-size:11px;opacity:.8}
.blook .cnt{position:absolute;top:-6px;right:-6px;background:#ffd36a;color:#1a1020;border-radius:999px;padding:2px 7px;font-size:11px;font-weight:900}
.blook.lock{opacity:.4;filter:grayscale(.85)}
.modal-bg{position:fixed;inset:0;background:#000c;z-index:50;display:grid;place-items:center;padding:12px}
.modal{width:min(560px,100%);max-height:min(92vh,860px);overflow:auto;background:#1b1228;border-radius:18px;border:1px solid #ffffff1a}
.modal-head{display:flex;gap:12px;align-items:center;padding:14px;background:linear-gradient(160deg,var(--c1),var(--c2))}
.modal-head img{width:72px;height:72px;object-fit:contain;border-radius:12px;background:#0003}
.modal-body{padding:14px}
.odds-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff10;font-size:13px}
.odds-row .left{display:flex;gap:8px;align-items:center;min-width:0}
.odds-row img{width:36px;height:36px;object-fit:contain}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.controls input[type=range]{flex:1;min-width:140px}
.btn-main{background:#f79a3e;color:#1a1020;border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;font-size:15px}
.btn-ghost{background:#2e2044;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}
.btn-main:disabled{opacity:.4;cursor:not-allowed}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.empty{opacity:.65;padding:28px 0;text-align:center}
.err{background:#5a1020;color:#ffd0d0;padding:10px 12px;border-radius:10px;margin:10px 0;font-size:13px}
.open-stage{min-height:320px;display:grid;place-items:center;padding:20px 10px;position:relative}
.pack-shake{width:160px;height:160px;object-fit:contain;animation:shake .7s ease-in-out infinite;filter:drop-shadow(0 12px 24px #0008)}
@keyframes shake{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-8deg) scale(1.04)}40%{transform:rotate(8deg) scale(1.06)}60%{transform:rotate(-6deg) scale(1.03)}80%{transform:rotate(6deg) scale(1.05)}}
.pack-burst{width:160px;height:160px;object-fit:contain;animation:burst .45s ease-out forwards}
@keyframes burst{0%{transform:scale(1) rotate(0);opacity:1}60%{transform:scale(1.35) rotate(8deg);opacity:.9}100%{transform:scale(.2) rotate(-12deg);opacity:0}}
.reveal-wrap{text-align:center;animation:popIn .45s cubic-bezier(.2,1.4,.3,1) both}
@keyframes popIn{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.reveal-img{width:140px;height:140px;object-fit:contain;display:block;margin:0 auto 10px;filter:drop-shadow(0 0 18px var(--glow,#fff8))}
.reveal-name{font-size:22px;font-weight:900}
.reveal-rar{font-size:14px;font-weight:800;margin-top:4px;letter-spacing:.04em;text-transform:uppercase}
.rarity-flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,var(--glow,#fff5),transparent 55%);animation:flash .6s ease-out}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.multi-queue{font-size:13px;opacity:.8;margin-top:8px}

</style>
</head>

</main>

  }

  function roll(pack) {
    var list = pack.blooks || [];
    if (!list.length) return null;
    var total = 0, i;
    for (i = 0; i < list.length; i++) total += Number(list[i].chance) || 0;
    if (total <= 0) return list[Math.floor(Math.random() * list.length)];
    var r = Math.random() * total;
    for (i = 0; i < list.length; i++) {
      r -= Number(list[i].chance) || 0;
      if (r <= 0) return list[i];
    }
    return list[list.length - 1];

        }
      }
      html += '</div></div>';
    }

  }

  function roll(pack) {
    var list = pack.blooks || [];
    if (!list.length) return null;

    if (total <= 0) return list[Math.floor(Math.random() * list.length)];
    var r = Math.random() * total;
    for (i = 0; i < list.length; i++) {
      r -= Number(list[i].chance) || 0;
      if (r <= 0) return list[i];
    }
    return list[list.length - 1];
  }

    var bg = document.getElementById('modalBg');
    bg.hidden = false;
    bg.innerHTML = '<div class="modal" style="--c1:' + esc(pack.c1) + ';--c2:' + esc(pack.c2) + '" id="modalBox"><div class="modal-head"><img src="' + esc(pack.image) + '" alt=""/><div><div style="font-size:18px;font-weight:900">' + esc(pack.name) + '</div><div>🪙 ' + pack.price + ' each · open up to 50</div></div></div><div class="modal-body">' + (canOpen ? '' : '<div class="err">Not enough tokens. Tap +100 in the header.</div>') + '<div style="font-weight:800;margin-bottom:8px">Odds per pack</div>' + odds + '<div class="controls"><label>Amount: <strong id="nLabel">1</strong></label><input id="nRange" type="range" min="1" max="' + max + '" value="1"/><span id="costLabel">Cost: ' + pack.price + '</span></div><div class="controls"><button type="button" class="btn-main" id="btnOpen"' + (canOpen ? '' : ' disabled') + '>Open pack</button><button type="button" class="btn-ghost" id="btnClose">Close</button></div></div></div>';
    var range = document.getElementById('nRange');
    function sync() {
      var n = parseInt(range.value, 10) || 1;
      document.getElementById('nLabel').textContent = n;
      document.getElementById('costLabel').textContent = 'Cost: ' + (n * pack.price);
      document.getElementById('btnOpen').disabled = state.tokens < n * pack.price;
    }
    range.addEventListener('input', sync);
    document.getElementById('btnClose').onclick = function (e) { e.preventDefault(); closeModal(); };
    document.getElementById('btnOpen').onclick = function (e) {
      e.preventDefault();
      e.stopPropagation();
      doOpen(pack, range.value);
    };
    document.getElementById('modalBox').onclick = function (e) { e.stopPropagation(); };
  }

  function renderMarket() {
    var root = document.getElementById('packGrid');
    var html = '';
    for (var i = 0; i < PACKS.length; i++) {
      var p = PACKS[i];
      html += '<button type="button" class="card" style="--c1:' + esc(p.c1) + ';--c2:' + esc(p.c2) + '" data-id="' + esc(p.id) + '"><img src="' + esc(p.image) + '" alt=""/><div class="meta"><span>' + esc(p.name) + '</span><span>🪙 ' + p.price + '</span></div></button>';
    }
    root.innerHTML = html;
    var buttons = root.querySelectorAll('.card');
    for (var j = 0; j < buttons.length; j++) {
      buttons[j].addEventListener('click', function () {
        var id = this.getAttribute('data-id');
        var pack = null;
        for (var k = 0; k < PACKS.length; k++) if (PACKS[k].id === id) pack = PACKS[k];
        if (pack) showPackModal(pack);
      });
    }
  }

  function renderInv() {
    var root = document.getElementById('invRoot');
    var counts = {};
    for (var i = 0; i < state.inv.length; i++) {
      var id = state.inv[i];
      counts[id] = (counts[id] || 0) + 1;
    }
    if (!state.inv.length) {
      root.innerHTML = '<div class="empty">No blooks yet — open packs in Market.</div>';
      return;
    }
    var html = '';
    for (var p = 0; p < PACKS.length; p++) {
      var pack = PACKS[p];
      var owned = 0;
      for (var b = 0; b < pack.blooks.length; b++) if (counts[pack.blooks[b].id]) owned++;
      if (!owned) continue;
      html += '<div class="section"><h2><span>' + esc(pack.name) + '</span><span class="mute">' + owned + '/' + pack.blooks.length + '</span></h2><div class="grid">';
      for (var j = 0; j < pack.blooks.length; j++) {
        var bl = pack.blooks[j];
        var n = counts[bl.id] || 0;
        if (!n) {
          html += '<div class="blook lock"><img src="' + esc(bl.image) + '" alt=""/><div class="name">???</div><div class="rar">Locked</div></div>';
        } else {
          html += '<div class="blook" style="border-color:' + (RCOLOR[bl.rarity] || '#fff3') + '">' + (n > 1 ? '<span class="cnt">×' + n + '</span>' : '') + '<img src="' + esc(bl.image) + '" alt=""/><div class="name">' + esc(bl.name) + '</div><div class="rar" style="color:' + (RCOLOR[bl.rarity] || '#aaa') + '">' + esc(bl.rarity) + '</div></div>';
        }
      }
      html += '</div></div>';
    }
    root.innerHTML = html || '<div class="empty">No blooks yet.</div>';
  }

  document.getElementById('modalBg').addEventListener('click', function (e) {
    if (e.target.id === 'modalBg') closeModal();
  });
  document.getElementById('tabMarket').onclick = function () {
    document.getElementById('tabMarket').classList.add('on');
    document.getElementById('tabInv').classList.remove('on');
    document.getElementById('viewMarket').hidden = false;
    document.getElementById('viewInv').hidden = true;
  };
  document.getElementById('tabInv').onclick = function () {
    document.getElementById('tabInv').classList.add('on');
    document.getElementById('tabMarket').classList.remove('on');
    document.getElementById('viewMarket').hidden = true;
    document.getElementById('viewInv').hidden = false;
    renderInv();
  };
  document.getElementById('addTok').onclick = function () {
    saveState({ tokens: state.tokens + 100, inv: state.inv.slice() });
  };

  renderMarket();
  renderInv();
})();

</script>
</body>
</html>
